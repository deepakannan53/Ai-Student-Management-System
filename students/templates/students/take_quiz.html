{% extends 'students/base.html' %}
{% block content %}
<div x-data="{
    started: false,
    secondsLeft: {{ quiz.duration_minutes }} * 60,
    tabViolations: 0,
    maxViolations: {{ quiz.max_tab_switches }},
    autoReason: '',
    startExam() {
      this.started = true;
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      setInterval(() => {
        if (!this.started) return;
        if (this.secondsLeft <= 1) this.forceSubmit('Time Expired (00:00)');
        else this.secondsLeft--;
      }, 1000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && this.started) {
          this.tabViolations++;
          if (this.tabViolations >= this.maxViolations) this.forceSubmit('Exceeded Tab-Switch Limit (' + this.tabViolations + ')');
          else alert('RULE WARNING: Tab switch detected (' + this.tabViolations + '/' + this.maxViolations + ')!');
        }
      });
    },
    forceSubmit(reason) {
      this.autoReason = reason;
      this.$nextTick(() => { document.getElementById('quizForm').submit(); });
    },
    formatTime() {
      return Math.floor(this.secondsLeft / 60).toString().padStart(2, '0') + ':' + (this.secondsLeft % 60).toString().padStart(2, '0');
    }
  }" class="n-card p-6 space-y-6">
  <div x-show="!started" class="space-y-4">
    <div class="font-dot text-2xl n-red-text">MANDATORY ASSESSMENT RULES</div>
    <h2 class="text-lg font-bold">{{ quiz.subject.code }} — {{ quiz.title }}</h2>
    <div class="p-4 rounded-2xl bg-[var(--bg-elevated)] border border-[#D71921] text-xs whitespace-pre-line">{{ quiz.rules_text }}</div>
    <button @click="startExam()" type="button" class="n-pill n-red px-6 py-3 text-xs font-bold">I AGREE — ENTER FULLSCREEN & BEGIN</button>
  </div>
  <div x-show="started" style="display:none;" class="space-y-6">
    <div class="sticky top-16 z-30 p-4 rounded-2xl bg-black border border-[#D71921] flex items-center justify-between text-xs">
      <div class="font-dot text-lg">{{ quiz.title }}</div>
      <div class="flex items-center gap-4">
        <span>VIOLATIONS: <strong class="n-red-text" x-text="tabViolations + '/' + maxViolations"></strong></span>
        <span class="px-3 py-1 rounded-full n-red font-bold text-sm" x-text="formatTime()"></span>
      </div>
    </div>
    <form id="quizForm" method="POST" class="space-y-5 text-xs">
      {% csrf_token %}
      <input type="hidden" name="tab_violations" :value="tabViolations">
      <input type="hidden" name="auto_submitted_reason" :value="autoReason">
      {% for q in questions %}
        <div class="p-5 rounded-2xl bg-[var(--bg-elevated)] border border-[var(--border-color)] space-y-3">
          <div class="font-bold text-sm">Q{{ forloop.counter }}. {{ q.question_text }}</div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
            <label class="flex items-center gap-2 p-3 rounded-xl border border-[var(--border-color)]"><input type="radio" name="q_{{ q.id }}" value="A"> <span>A) {{ q.option_a }}</span></label>
            <label class="flex items-center gap-2 p-3 rounded-xl border border-[var(--border-color)]"><input type="radio" name="q_{{ q.id }}" value="B"> <span>B) {{ q.option_b }}</span></label>
            <label class="flex items-center gap-2 p-3 rounded-xl border border-[var(--border-color)]"><input type="radio" name="q_{{ q.id }}" value="C"> <span>C) {{ q.option_c }}</span></label>
            <label class="flex items-center gap-2 p-3 rounded-xl border border-[var(--border-color)]"><input type="radio" name="q_{{ q.id }}" value="D"> <span>D) {{ q.option_d }}</span></label>
          </div>
        </div>
      {% endfor %}
      <button type="submit" class="n-pill n-red px-8 py-3 font-bold">SUBMIT ASSESSMENT</button>
    </form>
  </div>
</div>
{% endblock %}
