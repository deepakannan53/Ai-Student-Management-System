<!DOCTYPE html>
<html lang="en" class="{% if request.session.nothing_theme == 'LIGHT' %}light-theme{% else %}dark{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTHING OS // UNIFIED ACCESS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #000000;
      --bg-card: #0D0D0D;
      --bg-elevated: #161616;
      --text-primary: #FFFFFF;
      --text-muted: #8E8E93;
      --border-color: #262626;
      --nothing-red: #D71921;
    }
    html.light-theme {
      --bg-primary: #F5F5F7;
      --bg-card: #FFFFFF;
      --bg-elevated: #EBEBEF;
      --text-primary: #0A0A0A;
      --text-muted: #5C5C60;
      --border-color: #D4D4D8;
      --nothing-red: #D71921;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
      background-size: 20px 20px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .font-dot { font-family: 'DotGothic16', monospace; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-lg bg-[var(--bg-card)] border border-[var(--border-color)] rounded-3xl p-8 space-y-6 shadow-xl">
    <div class="flex items-start justify-between gap-2">
      <div class="space-y-1">
        <div class="flex items-center gap-2 font-dot text-2xl tracking-widest">
          <span class="w-3 h-3 rounded-full bg-[#D71921]"></span>
          NOTHING<span class="text-[#D71921]">//</span>SMS
        </div>
        <p class="text-xs text-[var(--text-muted)]">MULTI-ROLE AI-AGENTIC ACADEMIC OS</p>
      </div>
      <a href="{% url 'toggle_theme' %}" class="px-3 py-1.5 rounded-full border border-[var(--border-color)] bg-[var(--bg-elevated)] text-[10px] font-bold hover:border-[#D71921] flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full {% if request.session.nothing_theme == 'LIGHT' %}bg-black{% else %}bg-white{% endif %}"></span>
        {% if request.session.nothing_theme == 'LIGHT' %}DARK MODE{% else %}LIGHT MODE{% endif %}
      </a>
    </div>

    {% if messages %}
      {% for m in messages %}
        <div class="p-3 rounded-xl border border-[#D71921] text-xs text-[#D71921]">{{ m }}</div>
      {% endfor %}
    {% endif %}

    <form id="loginForm" method="POST" class="space-y-4 text-xs">
      {% csrf_token %}
      <div>
        <label class="block text-[var(--text-muted)] mb-1">SYSTEM USERNAME</label>
        <input id="uname" type="text" name="username" value="student" required class="w-full bg-[var(--bg-elevated)] border border-[var(--border-color)] rounded-xl px-4 py-3 text-[var(--text-primary)] focus:outline-none focus:border-[#D71921]">
      </div>
      <div>
        <label class="block text-[var(--text-muted)] mb-1">PASSKEY</label>
        <input id="upass" type="password" name="password" value="nothing123" required class="w-full bg-[var(--bg-elevated)] border border-[var(--border-color)] rounded-xl px-4 py-3 text-[var(--text-primary)] focus:outline-none focus:border-[#D71921]">
      </div>
      <button type="submit" class="w-full rounded-full bg-[#D71921] text-white font-bold py-3 tracking-widest hover:opacity-90">
        INITIALIZE SESSION &rarr;
      </button>
    </form>

    <div class="border-t border-[var(--border-color)] pt-4 space-y-2 text-[11px]">
      <div class="text-[var(--text-muted)] uppercase tracking-wider">Quick Role Fill (Password: nothing123):</div>
      <div class="flex flex-wrap gap-2">
        <button type="button" onclick="quickFill('student')" class="px-3 py-1 rounded-full border border-[var(--border-color)] hover:border-[#D71921]">Student (26MCA042)</button>
        <button type="button" onclick="quickFill('hod')" class="px-3 py-1 rounded-full border border-[#D71921] text-[#D71921] hover:bg-[#D71921] hover:text-white">HOD (Dr. Natarajan)</button>
        <button type="button" onclick="quickFill('staff1')" class="px-3 py-1 rounded-full border border-[var(--border-color)] hover:border-[#D71921]">Staff 1 (MCA101)</button>
        <button type="button" onclick="quickFill('staff2')" class="px-3 py-1 rounded-full border border-[var(--border-color)] hover:border-[#D71921]">Staff 2 (MCA102)</button>
        <button type="button" onclick="quickFill('staff3')" class="px-3 py-1 rounded-full border border-[var(--border-color)] hover:border-[#D71921]">Staff 3 (MCA103)</button>
        <button type="button" onclick="quickFill('staff4')" class="px-3 py-1 rounded-full border border-[var(--border-color)] hover:border-[#D71921]">Staff 4 (MCA104)</button>
        <button type="button" onclick="quickFill('staff5')" class="px-3 py-1 rounded-full border border-[var(--border-color)] hover:border-[#D71921]">Staff 5 (MCA105)</button>
      </div>
    </div>
  </div>
  <script>
    function quickFill(u) {
      document.getElementById('uname').value = u;
      document.getElementById('upass').value = 'nothing123';
    }
  </script>
</body>
</html>
